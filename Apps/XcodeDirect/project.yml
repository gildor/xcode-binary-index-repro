name: XcodeDirect
options:
  deploymentTarget: { iOS: "16.0" }
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    SWIFT_VERSION: "5.0"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  XcodeDirect:
    type: application
    platform: iOS
    sources: [../Shared]
    settings: { PRODUCT_BUNDLE_IDENTIFIER: repro.XcodeDirect }
    dependencies:
      - { framework: ../../Packages/BinaryPkg/Binaries/SwiftKit.xcframework }
      - { framework: ../../Packages/BinaryPkg/Binaries/ObjCKit.xcframework }
      - { framework: ../../Packages/BinaryPkg/Binaries/EngineSwift.xcframework }
      - { framework: ../../Packages/BinaryPkg/Binaries/EngineC.xcframework }
